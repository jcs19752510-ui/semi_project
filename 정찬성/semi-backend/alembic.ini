[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is filled in dynamically by alembic/env.py from
# app.core.config.Settings (keeps the DB password out of this file).
# NOTE: keep this file ASCII-only -- alembic reads it with the OS locale
# codepage (not UTF-8) on Windows, and non-ASCII text breaks the parser
# on machines whose locale codepage is not UTF-8 (e.g. Korean cp949).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
