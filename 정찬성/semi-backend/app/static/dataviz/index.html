<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>산탄데르 고객만족 데이터 탐색 (업무/모델 선택형)</title>
  <link rel="stylesheet" href="/static/dataviz/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>산탄데르 고객만족 데이터 탐색</h1>
    <p class="subtitle">업무명을 선택한 뒤 <b>모델명을 선택하면 자동으로</b> 전처리 검증 결과와 모델 수행결과를 함께 확인합니다.</p>
  </header>

  <section class="selector">
    <div class="selector-item">
      <label for="selTask">업무명</label>
      <select id="selTask">
        <option value="">전체</option>
      </select>
    </div>
    <div class="selector-item">
      <label for="selModel">모델명</label>
      <select id="selModel" disabled></select>
    </div>
    <button id="btnQuery" type="button" disabled>전처리조회</button>
    <span id="selectedLabel" class="selected-label"></span>
  </section>

  <p id="loadStatus" class="load-status" style="display:none;"></p>

  <section class="charts">
    <h2 class="section-title">전처리 데이터 검증결과</h2>
    <div class="chart-grid">
      <div class="chart-box">
        <h3 id="targetChartTitle">TARGET 클래스 불균형 분포</h3>
        <canvas id="targetChart"></canvas>
      </div>
      <div class="chart-box">
        <h3 id="bin1ChartTitle">연령 구간별 불만족 고객 비율</h3>
        <canvas id="ageRatioChart"></canvas>
      </div>
      <div class="chart-box">
        <h3 id="bin2ChartTitle">계좌잔고 구간별 불만족 고객 비율</h3>
        <canvas id="balanceRatioChart"></canvas>
      </div>
      <div class="chart-box">
        <h3 id="boxplotTitle">계좌잔고(saldo_var30) 만족여부별 비교</h3>
        <div id="boxplot" class="boxplot"></div>
      </div>
    </div>
  </section>

  <section class="charts">
    <h2 class="section-title">모델 수행결과</h2>
    <div class="chart-grid single">
      <div class="chart-box wide">
        <h3>ROC 곡선 <span id="aucLabel" class="auc-label"></span></h3>
        <canvas id="rocChart"></canvas>
      </div>
    </div>
  </section>

  <p id="emptyHint" class="empty-hint">업무명과 모델명을 선택하면 결과가 자동으로 표시됩니다.</p>

  <script src="/static/dataviz/app.js"></script>
</body>
</html>
