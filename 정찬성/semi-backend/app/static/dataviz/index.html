<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>산탄데르 고객만족 데이터 탐색</title>
  <link rel="stylesheet" href="/static/dataviz/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>산탄데르 고객만족 데이터 탐색</h1>
    <p class="subtitle">캐글산탄데르.ipynb EDA를 웹 대시보드로 재구성 — 필터를 바꾸면 그래프와 표가 즉시 갱신됩니다.</p>
  </header>

  <section class="summary-cards" id="summaryCards">
    <div class="card"><span class="label">전체 데이터</span><span class="value" id="sumTotal">-</span></div>
    <div class="card"><span class="label">컬럼 수</span><span class="value" id="sumColumns">-</span></div>
    <div class="card"><span class="label">불만족 비율</span><span class="value" id="sumRatio">-</span></div>
    <div class="card"><span class="label">연령(var15) 범위</span><span class="value" id="sumAge">-</span></div>
    <div class="card"><span class="label">var38 평균</span><span class="value" id="sumVar38">-</span></div>
  </section>

  <section class="filters">
    <div class="filter-item">
      <label for="filterTarget">TARGET</label>
      <select id="filterTarget">
        <option value="">전체</option>
        <option value="0">만족(0)</option>
        <option value="1">불만족(1)</option>
      </select>
    </div>
    <div class="filter-item">
      <label for="filterAgeMin">연령(var15) 최소</label>
      <input type="number" id="filterAgeMin" min="0" max="120" placeholder="예: 20" />
    </div>
    <div class="filter-item">
      <label for="filterAgeMax">연령(var15) 최대</label>
      <input type="number" id="filterAgeMax" min="0" max="120" placeholder="예: 60" />
    </div>
    <div class="filter-item">
      <label for="filterRegion">지역(var3)</label>
      <select id="filterRegion">
        <option value="">전체</option>
      </select>
    </div>
    <div class="filter-item checkbox-item">
      <label for="filterLogScale">var38 로그 스케일</label>
      <input type="checkbox" id="filterLogScale" checked />
    </div>
    <button id="btnReset" type="button">필터 초기화</button>
  </section>

  <section class="charts">
    <div class="chart-box">
      <h2>TARGET 분포 (만족 vs 불만족)</h2>
      <canvas id="targetChart"></canvas>
    </div>
    <div class="chart-box">
      <h2>var38(대출액수) 분포</h2>
      <canvas id="var38Chart"></canvas>
    </div>
    <div class="chart-box wide">
      <h2>var15(연령) 분포 — 만족/불만족 비교</h2>
      <canvas id="ageChart"></canvas>
    </div>
  </section>

  <section class="table-section">
    <div class="table-header">
      <h2>레코드 조회</h2>
      <span id="tableInfo"></span>
    </div>
    <div class="table-scroll">
      <table id="recordsTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>var3(지역)</th>
            <th>var15(연령)</th>
            <th>var38(대출액수)</th>
            <th>TARGET</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="pagination">
      <button id="btnPrev" type="button">이전</button>
      <span id="pageInfo"></span>
      <button id="btnNext" type="button">다음</button>
    </div>
  </section>

  <script src="/static/dataviz/app.js"></script>
</body>
</html>
