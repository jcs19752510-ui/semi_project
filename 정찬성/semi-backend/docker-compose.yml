services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-semi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-semi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - semi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-semi} -d ${POSTGRES_DB:-semi}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  semi_pgdata:
