[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semi-backend"
version = "0.1.0"
description = "SEMI (토요하자) 프로젝트 백엔드 — 1단계 기반 구조"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.139.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.51",
    "alembic==1.19.1",
    "psycopg[binary]==3.3.4",
    "pwdlib[argon2]==0.3.0",
    "cryptography==50.0.0",
    "uvicorn[standard]==0.50.0",
    "pandas==3.0.5",
    "numpy==2.5.2",
    "lightgbm==4.7.0",
    "scikit-learn==1.9.0",
    "xgboost==3.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
